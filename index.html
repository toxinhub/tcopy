<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<meta name="description" content="A simple place to save and access your notes across devices.">
<meta property="og:type" content="website">
<meta property="og:title" content="tcopy — Quick notes">
<meta property="og:description" content="Save links, text and quick notes in one place.">
<meta property="og:image" content="https://toxinhub.github.io/tcopy/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=15">
<title>tcopy — Quick notes</title>

<style id="visibility-switch-critical">
.visibility-control{display:flex!important;align-items:center!important;gap:8px!important;min-width:0!important}
.visibility-switch{display:inline-flex!important;align-items:center!important;gap:3px!important;padding:3px!important;border:1px solid var(--line,#ddd)!important;border-radius:999px!important;background:var(--surface-2,#eee)!important}
.visibility-option{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:58px!important;min-height:30px!important;padding:0 12px!important;border:1px solid transparent!important;border-radius:999px!important;background:transparent!important;color:var(--muted,#666)!important;font:650 11px/1 var(--f-b,Arial,sans-serif)!important;white-space:nowrap!important}
.visibility-option.is-active{background:var(--surface,#fff)!important;border-color:var(--line,#ddd)!important;color:var(--accent,#3b4cca)!important;box-shadow:0 1px 4px rgba(0,0,0,.1)!important}
.visibility-option:disabled{opacity:.42!important}
.visibility-control select{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;opacity:0!important;pointer-events:none!important;clip-path:inset(50%)!important}
@media(max-width:720px){.visibility-option{min-width:48px!important;min-height:27px!important;padding:0 9px!important;font-size:10px!important}.visibility-control{gap:5px!important}}
</style>
</head>
<body>
<header class="top hd">
 <a class="brand" href="./" aria-label="tcopy home"><span class="logo-mark" aria-hidden="true">t</span><span>tcopy</span></a>
 <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="search-input" id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></label>
 <div class="actions"><span class="sync" aria-live="polite"><span class="dot" id="dot"></span><span id="st">Ready to sync</span></span><button class="ibtn theme-btn" id="theme" aria-label="Toggle light and dark theme" title="Theme">◐</button><button class="ibtn account-btn" id="account" aria-label="Account menu"><span class="avatar" aria-hidden="true">T</span><span id="accountLabel">Sign in</span></button><button class="ibtn admin-btn" id="admin" aria-pressed="false" hidden>Admin</button></div>
 <nav class="seg" aria-label="Filter notes by time"><button data-v="day" aria-pressed="true">Day</button><button data-v="week" aria-pressed="false">Week</button><button data-v="month" aria-pressed="false">Month</button></nav>
</header>
<div class="main">
 <div class="scroller" id="scroller"><div class="pull-refresh" id="pullRefresh" aria-hidden="true"><span class="pull-spinner"></span><span id="pullLabel">Pull to refresh</span></div>
  <main class="list">
   <form class="cmp" id="cmp">
    <div class="composer-head"><span class="composer-title">Quick capture</span><div class="visibility-control"><span class="composer-hint">Save as</span><div class="visibility-switch" id="visibilitySwitch" role="group" aria-label="Note visibility"><button type="button" class="visibility-option is-active" data-visibility="public" aria-pressed="true">Public</button><button type="button" class="visibility-option" data-visibility="private" aria-pressed="false" disabled>Private</button></div><select id="visibility" aria-label="Note visibility" tabindex="-1" aria-hidden="true"><option value="public">Public</option><option value="private">Private</option></select></div></div>
    <textarea id="in" rows="1" maxlength="20000" placeholder="Drop a thought, link, or snippet…" aria-label="New note"></textarea>
    <button type="button" class="cb paste-btn" id="paste" aria-label="Paste from clipboard"><span class="paste-icon" aria-hidden="true">↓</span><span class="paste-label">Paste</span></button>
    <button type="submit" class="cb go" id="save" disabled><span class="save-label">Save</span><span class="k">Ctrl ↵</span></button>
   </form>
   <div class="notes-heading"><b>Your notes</b><span id="count" aria-live="polite"></span></div><div class="col" id="list"><div class="empty">Your notebook is ready.</div></div>
  </main>
 </div>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<dialog class="reader" id="reader" aria-labelledby="readerTitle"><div class="reader-head"><b id="readerTitle">Note</b><div class="reader-tools"><button class="reader-size" id="readerMinus" aria-label="Smaller text">A−</button><button class="reader-size" id="readerPlus" aria-label="Larger text">A+</button><button class="reader-copy" id="readerCopy">Copy</button><button class="reader-close" id="readerClose" aria-label="Close">×</button></div></div><div class="reader-body" id="readerBody" tabindex="0"></div></dialog>
<div class="authveil" id="authveil" role="dialog" aria-modal="true" aria-labelledby="authTitle">
 <div class="authbox"><h2 id="authTitle">Welcome to tcopy</h2><p>Sign in to unlock Private notes and sync your personal notebook across devices. Public notes stay available to everyone.</p>
  <form id="authform"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><div class="authactions"><button type="button" id="authclose">Not now</button><button class="primary" type="submit" id="authsubmit">Sign in</button></div></form><p class="authhint" id="authhint" aria-live="polite"></p>
 </div>
</div>
<script type="module" src="./app.js?v=15"></script>
</body></html>
