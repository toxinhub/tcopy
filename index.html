function isLong(s){return s.length>260||s.split("\n").length>6}
function find(id){return clips.find(c=>c.id===id)}
function draw(){const queryText=qText.trim().toLowerCase(),arr=clips.filter(c=>!queryText||c.text.toLowerCase().includes(queryText));let html="";if(!arr.length){html='<div class="empty">'+(queryText?"No notes found for “"+safe(qText.trim())+"”.":"Your notebook is empty.")+'</div><div class="subempty">'+(queryText?"Try another search.":"Add your first note below. It will show up here on your other signed-in devices, too.")+'</div>'}else{const groups=[],map=new Map(),pins=arr.filter(c=>c.pinned).sort((a,b)=>b.createdMs-a.createdMs);if(pins.length)groups.push({id:"pinned",label:"Pinned",sub:"",items:pins,pinned:true});for(const c of arr.filter(c=>!c.pinned).sort((a,b)=>b.createdMs-a.createdMs)){const g=dateGroup(c.createdMs),id=view+":"+g.key;if(!map.has(id)){const x={id,label:g.label,sub:g.sub,items:[]};map.set(id,x);groups.push(x)}map.get(id).items.push(c)}groups.forEach((g,i)=>{const closed=collapsed[g.id]!==undefined?collapsed[g.id]:(!g.pinned&&!queryText&&i>=4);html+='<section class="grp"><button class="gh" data-group="'+safe(g.id)+'" aria-expanded="'+(!closed)+'"><span class="chev"></span><b>'+safe(g.label)+'</b>'+(g.sub?'<small>'+safe(g.sub)+'</small>':'')+'<span class="n">'+g.items.length+'</span></button>';if(!closed)html+=g.items.map(renderClip).join("");html+="</section>"})}if(!configured)html+='<p class="foot">Setup needed: add your new Firebase web app config to <code>index.html</code> to enable sign-in and cloud sync.</p>';$("list").innerHTML=html;fresh=null;if(editing){const ta=document.querySelector("[data-edit]"),c=find(editing);if(ta&&c){ta.value=c.text;grow(ta);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}}
function renderClip(c){const ed=editing===c.id,long=isLong(c.text),open=!!expanded[c.id],body=ed?'<textarea class="edit" data-edit rows="2" aria-label="Edit note"></textarea>':'<p class="txt'+(isCode(c.text)?" code":"")+(long&&!open?" clamp":"")+'">'+escapeLinks(c.text)+'</p>';const acts=ed?'<button class="mb" data-action="cancel">Cancel</button><button class="mb copy" data-action="confirm">Save edit</button>':(long?'<button class="mb" data-action="more">'+(open?"Show less":"Read more")+'</button>':'')+'<button class="mb admin-only" data-action="edit">Edit</button><button class="mb admin-only del" data-action="delete">Delete</button><button class="mb" data-action="pin">'+(c.pinned?"Unpin":"Pin")+'</button><button class="mb copy" data-action="copy">Copy</button>';return '<article class="clip'+(c.id===fresh?" new":"")+'" data-id="'+safe(c.id)+'">'+body+'<div class="meta"><span class="tm">'+fmtShort.format(c.createdMs)+" "+fmtTime.format(c.createdMs)+'</span>'+(c.updatedAt?'<span class="tag">Edited</span>':'')+'<span class="sp"></span>'+acts+'</div></article>'}
function grow(el,max){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,max||Infinity)+"px"}
function render(){requestAnimationFrame(draw)}
function requireReady(){if(!user){openAuth();return false}if(!configured){toast("Firebase setup is not finished yet.");return false}return true}
async function addNote(text){text=text.trim();if(!text||!requireReady())return;try{setSync("busy","Saving…");const ref=await addDoc(collection(db,"clips"),{ownerUid:user.uid,text,pinned:false,createdAt:serverTimestamp(),updatedAt:null});fresh=ref.id;$("in").value="";saveDraft("");updateComposer();$("scroller").scrollTo({top:0,behavior:"smooth"});toast("Saved and syncing across your devices")}catch(e){setSync("off","Could not save");toast(errorMessage(e))}}
async function commitEdit(c){const ta=document.querySelector("[data-edit]"),text=ta?.value.trim();if(!text){toast("A note can't be empty.");return}try{await updateDoc(doc(db,"clips",c.id),{text,updatedAt:serverTimestamp()});editing=null;render();toast("Your changes are saved")}catch(e){toast(errorMessage(e))}}
function errorMessage(e){const code=e?.code||"";return code.includes("permission-denied")?"You don't have permission to do that.":code.includes("network")?"Connection issue. Try again when you're online.":code.includes("email-already-in-use")?"That email is already registered. Try signing in.":code.includes("invalid-credential")?"Email or password doesn't look right.":(e?.message||"Something went wrong. Please try again.").replace("Firebase: ","").slice(0,150)}
function openAuth(){ $("authhint").textContent="";$("authveil").classList.add("open");$("email").focus()}
function closeAuth(){$("authveil").classList.remove("open")}
function saveDraft(value){try{localStorage.setItem("tcopy-draft",value)}catch{}}
function updateComposer(){const ta=$("in");$("save").disabled=!ta.value.trim();grow(ta,140)}
function attachFeed(){if(stopFeed)stopFeed();if(!user)return;setSync("busy","Connecting…");const base=collection(db,"clips"),feed=isAdmin?query(base,orderBy("createdAt","desc")):query(base,where("ownerUid","==",user.uid),orderBy("createdAt","desc"));stopFeed=onSnapshot(feed,snap=>{clips=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,createdMs:x.createdAt?.toMillis?.()||Date.now()}});setSync("ok","All caught up");render()},err=>{setSync("off","Sync unavailable");toast(errorMessage(err))})}
async function refreshRole(u){try{const token=await getIdTokenResult(u,true);isAdmin===!!token.claims.admin?null:(isAdmin=!!token.claims.admin);document.body.classList.toggle("admin",isAdmin);$("admin").hidden=!isAdmin;$("admin").setAttribute("aria-pressed","false")}catch{isAdmin=false;document.body.classList.remove("admin");$("admin").hidden=true}}
if(configured){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{user=u;if(stopFeed){stopFeed();stopFeed=null}clips=[];editing=null;if(u){await refreshRole(u);$("account").textContent="Sign out";attachFeed()}else{isAdmin=false;document.body.classList.remove("admin");$("admin").hidden=true;$("account").textContent="Sign in";setSync("off","Sign in to sync");render()}})}else{setSync("off","Firebase setup needed");render()}
$("account").onclick=async()=>{if(user){try{await signOut(auth);toast("You’re signed out")}catch(e){toast(errorMessage(e))}}else openAuth()};
$("admin").onclick=()=>{if(!isAdmin)return;const on=!document.body.classList.contains("admin");document.body.classList.toggle("admin",on);$("admin").setAttribute("aria-pressed",String(on));if(!on&&editing){editing=null;render()}toast(on?"Admin tools are on":"Admin tools are off")};
$("authclose").onclick=closeAuth;$("authveil").addEventListener("click",e=>{if(e.target===$("authveil"))closeAuth()});
$("authform").onsubmit=async e=>{e.preventDefault();if(!configured)return;const email=$("email").value.trim(),password=$("password").value;const b=$("authsubmit");b.disabled=true;$("authhint").textContent="Please wait…";try{await signInWithEmailAndPassword(auth,email,password);closeAuth();toast("Welcome back!")}catch(err){if(err.code==="auth/user-not-found"||err.code==="auth/invalid-credential"){const create=confirm("We couldn't sign you in. Would you like to create an account with this email?");if(create){try{await createUserWithEmailAndPassword(auth,email,password);closeAuth();toast("Your account is ready")}catch(x){$("authhint").textContent=errorMessage(x)}}else $("authhint").textContent=errorMessage(err)}else $("authhint").textContent=errorMessage(err)}finally{b.disabled=false}};
$("cmp").onsubmit=e=>{e.preventDefault();addNote($("in").value)};$("in").addEventListener("input",()=>{updateComposer();clearTimeout(draftTimer);draftTimer=setTimeout(()=>saveDraft($("in").value),250)});$("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("cmp").requestSubmit()}});
$("paste").onclick=async()=>{try{const text=await navigator.clipboard.readText();if(text){$("in").value+=$("in").value?"\n"+text:text;updateComposer();saveDraft($("in").value)}$("in").focus()}catch{$("in").focus();toast("Clipboard access is blocked. You can still use Ctrl + V.")}};
$("list").addEventListener("click",async e=>{const b=e.target.closest("[data-action],[data-group]");if(!b)return;if(b.dataset.group){collapsed[b.dataset.group]=b.getAttribute("aria-expanded")==="true";render();return}const action=b.dataset.action,article=b.closest("[data-id]"),c=article&&find(article.dataset.id);if(!c)return;if(action==="copy"){try{await navigator.clipboard.writeText(c.text);toast("Copied to clipboard")}catch{toast("Clipboard access is blocked")}}else if(action==="pin"){try{await updateDoc(doc(db,"clips",c.id),{pinned:!c.pinned,updatedAt:serverTimestamp()})}catch(x){toast(errorMessage(x))}}else if(action==="more"){expanded[c.id]=!expanded[c.id];render()}else if(action==="edit"){editing=c.id;render()}else if(action==="cancel"){editing=null;render()}else if(action==="confirm")commitEdit(c);else if(action==="delete"){if(!confirm("Delete this note? This can't be undone."))return;try{await deleteDoc(doc(db,"clips",c.id));toast("Note deleted")}catch(x){toast(errorMessage(x))}}});
$("list").addEventListener("input",e=>{if(e.target.matches("[data-edit]"))grow(e.target)});
$("list").addEventListener("keydown",e=>{if(!e.target.matches("[data-edit]"))return;if(e.key==="Escape"){editing=null;render()}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const c=find(editing);if(c)commitEdit(c)}});
document.querySelector(".seg").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;view=b.dataset.v;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("scroller").scrollTop=0;render()};
let searchTimer;$("q").oninput=e=>{clearTimeout(searchTimer);const v=e.target.value;searchTimer=setTimeout(()=>{qText=v;render()},100)};
$("theme").onclick=()=>{const r=document.documentElement,nowDark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=nowDark?"light":"dark";try{localStorage.setItem("tcopy-theme",r.dataset.theme)}catch{}};
try{const theme=localStorage.getItem("tcopy-theme");if(theme)document.documentElement.dataset.theme=theme;const draft=localStorage.getItem("tcopy-draft");if(draft)$("in").value=draft}catch{}updateComposer();
document.addEventListener("keydown",e=>{const typing=e.target.matches?.("input,textarea");if(e.key==="/"&&!typing){e.preventDefault();$("q").focus()}if(e.key==="Escape"&&e.target===$("q")){$("q").value="";qText="";e.target.blur();render()}});
window.addEventListener("online",()=>{if(user)setSync("busy","Reconnecting…")});window.addEventListener("offline",()=>setSync("off","You're offline"));
if("serviceWorker" in navigator && location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
