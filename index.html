<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<meta name="description" content="A simple place to save and access your notes across devices.">
<meta property="og:type" content="website">
<meta property="og:title" content="tcopy — Quick notes">
<meta property="og:description" content="Save links, text and quick notes in one place.">
<meta property="og:image" content="https://toxinhub.github.io/tcopy/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<script>try{const t=localStorage.getItem("tcopy-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark"}catch{}</script>
<link rel="stylesheet" href="./style.css?v=52">
<title>tcopy — Quick notes</title>

<style id="visibility-switch-critical">
.visibility-control{display:flex!important;align-items:center!important;gap:8px!important;min-width:0!important}
.visibility-switch{display:inline-flex!important;align-items:center!important;gap:3px!important;padding:3px!important;border:1px solid var(--line,#ddd)!important;border-radius:999px!important;background:var(--surface-2,#eee)!important}
.visibility-option{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:58px!important;min-height:30px!important;padding:0 12px!important;border:1px solid transparent!important;border-radius:999px!important;background:transparent!important;color:var(--muted,#666)!important;font:650 11px/1 var(--f-b,Arial,sans-serif)!important;white-space:nowrap!important}
.visibility-option.is-active{background:var(--surface,#fff)!important;border-color:var(--line,#ddd)!important;color:var(--accent,#3b4cca)!important;box-shadow:0 1px 4px rgba(0,0,0,.1)!important}
.visibility-option:disabled{opacity:.42!important}
.visibility-control select{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;opacity:0!important;pointer-events:none!important;clip-path:inset(50%)!important}
@media(max-width:720px){.visibility-option{min-width:48px!important;min-height:27px!important;padding:0 9px!important;font-size:10px!important}.visibility-control{gap:5px!important}}
</style>
</head>
<body>
<header class="top hd">
 <a class="brand" href="./" aria-label="tcopy home"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M7 3.75h7l4 4V20a.0 0 0 1-.0 0H7a2 2 0 0 1-2-2V5.75a2 2 0 0 1 2-2Z"/><path d="M14 3.75v4h4M8.5 12h7M8.5 15.5h7"/></svg></span><span class="brand-name">tcopy</span></a>
 <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="search-input" id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></label>
 <div class="actions"><span class="sync" aria-live="polite"><span class="dot" id="dot"></span><span id="st">Ready to sync</span></span><button class="ibtn theme-btn" id="theme" aria-label="Toggle light and dark theme" title="Switch theme"><svg class="ui-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="ui-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></svg></button><button class="ibtn account-btn" id="account" aria-label="Account menu"><span class="avatar" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg></span><span id="accountLabel">Sign in</span></button><button class="ibtn admin-btn" id="admin" aria-pressed="false" hidden><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg><span>Admin</span></button></div>
 <nav class="seg" aria-label="Filter notes by time"><button data-v="day" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Day</span></button><button data-v="week" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2m4 0h2m-8 3h2m4 0h2"/></svg><span>Week</span></button><button data-v="month" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h8"/></svg><span>Month</span></button></nav>
</header>
<div class="main">
 <div class="scroller" id="scroller"><div class="pull-refresh" id="pullRefresh" aria-hidden="true"><span class="pull-spinner"></span><span id="pullLabel">Pull to refresh</span></div>
  <main class="list">
   <form class="cmp" id="cmp">
    <div class="composer-head"><span class="composer-title" hidden>Quick capture</span><div class="visibility-control"><span class="composer-hint" hidden>Save as</span><div class="visibility-switch" id="visibilitySwitch" role="group" aria-label="Note visibility"><button type="button" class="visibility-option is-active" data-visibility="public" aria-label="Public note" title="Public" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg><span>Public</span></button><button type="button" class="visibility-option" data-visibility="private" aria-label="Private note" title="Private" aria-pressed="false" disabled><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Private</span></button></div><select id="visibility" aria-label="Note visibility" tabindex="-1" aria-hidden="true"><option value="public">Public</option><option value="private">Private</option></select></div></div>
    <textarea id="in" rows="1" maxlength="20000" placeholder="Drop a thought, link, or snippet…" aria-label="New note"></textarea>
    <button type="button" class="cb paste-btn" id="paste" aria-label="Paste from clipboard"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 10v7m-3-3 3 3 3-3"/></svg><span class="paste-label">Paste</span></button>
    <button type="submit" class="cb go" id="save" disabled><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg><span class="save-label">Save</span><span class="k">Ctrl ↵</span></button>
   </form>
   <div class="notes-heading"><b>Your notes</b><span id="count" aria-live="polite"></span></div><div class="col" id="list" aria-busy="true"><div class="skeleton" role="status" aria-label="Loading your notes"><i></i><i></i><i></i></div><div class="skeleton" aria-hidden="true"><i></i><i></i></div></div>
  </main>
 </div>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<dialog class="reader" id="reader" aria-labelledby="readerTitle"><div class="reader-head"><b id="readerTitle">Note</b><div class="reader-tools"><button class="reader-size" id="readerMinus" aria-label="Smaller text">A−</button><button class="reader-size" id="readerPlus" aria-label="Larger text">A+</button><button class="reader-copy" id="readerCopy"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>Copy</span></button><button class="reader-close" id="readerClose" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div></div><div class="reader-body" id="readerBody" tabindex="0"></div></dialog>
<div class="authveil" id="authveil" role="dialog" aria-modal="true" aria-labelledby="authTitle">
 <div class="authbox"><h2 id="authTitle">Welcome to tcopy</h2><p>Sign in to unlock Private notes and sync your personal notebook across devices. Public notes stay available to everyone.</p>
  <form id="authform"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><div class="authactions"><button type="button" id="authclose">Not now</button><button class="primary" type="submit" id="authsubmit"><span>Sign in</span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button></div></form><p class="authhint" id="authhint" aria-live="polite"></p>
 </div>
</div>
<script type="module" src="./app.js?v=52"></script>
</body></html>
